name: Release

# Publishes to PyPI on a version tag. Publishing uses trusted publishing:
# the Gatewise owner adds this repository as a pending publisher at
# pypi.org (project "gatewise" -> Publishing -> GitHub), and no PyPI token
# is stored anywhere in this repository. First publish must go through that
# configuration; check the environment matches (`environment: pypi`).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Test, build, and smoke-test the distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # A tag whose version disagrees with the package would publish a
      # release nothing in the repository agrees with. Fail before building.
      - name: Tag version matches pyproject.toml
        run: |
          python - <<'EOF'
          import re, sys, tomllib, pathlib
          tag = "${GITHUB_REF_NAME}".lstrip("v")
          declared = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if tag != declared:
              sys.exit(f"tag v{tag} does not match pyproject.toml version {declared}")
          print(f"release {declared} confirmed")
          EOF

      - name: Install tooling and the package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build "twine>=5"

      # The suite must pass without network or API keys before a release is
      # cut; the same guarantee as CI, repeated at the moment it matters.
      - name: Test
        run: pytest -q

      - name: Build sdist and wheel
        run: python -m build

      - name: Metadata check
        run: twine check dist/*

      # Publishing a wheel that does not import, a console script that does
      # not exist, or a registry without its question definitions is the one
      # release failure a tag cannot undo; the last check catches package
      # data that setuptools would otherwise silently drop.
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/release-check
          /tmp/release-check/bin/pip install dist/*.whl
          /tmp/release-check/bin/python -c "import gatewise.actions.pipeline; import gatewise.review; print('imports ok')"
          /tmp/release-check/bin/python -c "from gatewise.decisions.registry import load_registry; registry = load_registry(); print(f'{len(registry.identifiers())} questions loaded')"
          /tmp/release-check/bin/gatewise --help > /dev/null && echo "CLI ok"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing: PyPI verifies this workflow's OIDC token.
      id-token: write
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
