name: Gatewise PR triage
description: >-
  Review one pull request with the Gatewise decision layer and post the triage
  report as a PR comment. A model failure fails the run loudly; it never
  produces a default verdict.
author: ApexYash11

# Consumer contract: the calling workflow grants least privilege
# (pull-requests: write, issues: write, contents: read) and passes secrets
# only as action inputs:
#
#   permissions:
#     pull-requests: write
#     issues: write
#     contents: read
#   steps:
#     - uses: ApexYash11/Gatewise@v0.2.0
#       with:
#         github-token: ${{ secrets.GITHUB_TOKEN }}
#         typesafe-api-key: ${{ secrets.TYPESAFE_API_KEY }}

branding:
  icon: git-pull-request
  color: blue

inputs:
  github-token:
    description: >-
      Token used to fetch the pull request and to perform the actions the run
      justifies. Falls back to the workflow's automatic token.
    required: false
    default: ${{ github.token }}
  jev-api-key:
    description: >-
      Deprecated alias for typesafe-api-key. Set one of the two model keys;
      when both are set, typesafe-api-key wins (it is the canonical key the
      SDK reads).
    required: false
    default: ""
  typesafe-api-key:
    description: >-
      Decision-model key in TYPESAFE_API_KEY form. One model key is required;
      nothing runs without one.
    required: false
    default: ""
  openrouter-api-key:
    description: >-
      Decision-model key reaching the same Jev model through OpenRouter.
      Alternative to typesafe-api-key when only one key is configured.
    required: false
    default: ""
  package:
    description: >-
      Distribution to install: `pypi` (default, `pip install gatewise`) or a
      local path such as `${{ github.action_path }}` to install this checkout.
    required: false
    default: pypi
  python-version:
    description: Python version used to run the review.
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      run: |
        if [ -z "${{ inputs.typesafe-api-key }}${{ inputs.jev-api-key }}${{ inputs.openrouter-api-key }}" ]; then
          echo "::error::Set typesafe-api-key (or its jev-api-key alias) or openrouter-api-key. Gatewise fails loudly without a decision-model key; there is no default verdict."
          exit 1
        fi
        if [ -z "${{ github.event.number }}" ]; then
          echo "::error::gatewise-action only runs on pull_request events: the PR number must come from the pull-request event payload."
          exit 1
        fi

    - name: Set up Python
      uses: actions/setup-python@v5.1.1
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Gatewise
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ "${{ inputs.package }}" = "pypi" ]; then
          pip install gatewise
        else
          pip install "${{ inputs.package }}"
        fi

    - name: Review the pull request
      id: review
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        TYPESAFE_API_KEY: ${{ inputs.typesafe-api-key }}${{ inputs.jev-api-key }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
      # The review step must never abort the composite before the triage
      # comment is posted: its exit code is captured and re-raised later, so a
      # failed run (exit 3/4/5/6) still lands on the PR as a comment first.
      run: |
        set +e
        gatewise review \
          "${{ github.repository }}" "${{ github.event.number }}" \
          > "$RUNNER_TEMP/gatewise-review.txt"
        echo "exit-code=$?" >> "$GITHUB_OUTPUT"

    - name: Post the triage comment
      if: always()
      uses: actions/github-script@v7.1.0
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          // The CLI's review report is the comment body verbatim; this step
          // only adds the marker that identifies the Gatewise triage comment.
          const fs = require("fs");
          const marker = "<!-- gatewise-triage -->";
          const report = fs.readFileSync(
            `${process.env.RUNNER_TEMP}/gatewise-review.txt`, "utf8");
          const body = `${marker}\n${report}`;
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const issue_number = context.payload.pull_request.number;
          const existing = await github.paginate(
            github.rest.issues.listComments, { owner, repo, issue_number });
          const owned = existing.find((comment) =>
            comment.body && comment.body.includes(marker) &&
            comment.user.type === "Bot");
          if (owned) {
            await github.rest.issues.updateComment({
              owner, repo, comment_id: owned.id, body,
            });
          } else {
            await github.rest.issues.createComment({
              owner, repo, issue_number, body,
            });
          }

    - name: Fail the run when the review failed
      if: always()
      shell: bash
      run: |
        exit ${{ steps.review.outputs.exit-code }}
