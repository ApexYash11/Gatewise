[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gatewise"
version = "0.2.0"
description = "Decision infrastructure for autonomous software engineering, powered by typed System-1 decision models."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]

dependencies = [
    "typesafe-sdk>=0.7.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "aiosqlite>=0.20", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
gatewise = "gatewise.review.cli:main"

[tool.setuptools]
# The gatewise namespace sits at the repository root, so the default
# discovery root is used.

[tool.setuptools.packages.find]
include = ["gatewise*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

# Launcher and demo scripts deliberately import after a sys.path insert, and
# carry long presentation strings; they are checked lightly.
[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402", "E501"]

[tool.mypy]
python_version = "3.12"
files = ["gatewise"]
check_untyped_defs = true
ignore_missing_imports = true
