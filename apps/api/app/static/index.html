<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gatewise — decision index</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Gate<span class="dot">.</span>wise</h1>
    <span class="sub">typed decision index</span>
    <span class="spacer"></span>
    <span class="live"><i></i><span id="prov">connecting…</span></span>
  </header>

  <div class="stats" id="stats"></div>
  <div class="filters" id="filters">
    <span class="chip" data-filter="all" aria-pressed="true">all</span>
    <span class="chip" data-filter="attention" aria-pressed="false">needs attention</span>
    <span class="chip" data-filter="high" aria-pressed="false">high risk</span>
    <span class="chip" data-filter="security" aria-pressed="false">security</span>
    <span class="chip" data-filter="failed" aria-pressed="false">failed</span>
    <input class="search" id="q" type="search" placeholder="filter by title, number or author…" autocomplete="off">
  </div>
  <div class="hint" id="hint"></div>
  <div id="body"><div class="empty">Loading decisions…</div></div>

  <div class="foot">
    <span>Decisions from TypeSafe Jev.</span>
    <span>No estimates: every number here is a stored run.</span>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
